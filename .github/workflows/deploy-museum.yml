# Deployt das Museum (Ordner museum/) bei jedem Push auf claude/our-museum direkt zu Vercel – ohne dass Vercel
# Zugriff auf dieses GitHub-Konto braucht. Einmalig nötig: Repository-Secret VERCEL_TOKEN (siehe museum/README.md).
name: Deploy museum to Vercel

on:
  push:
    branches: [claude/our-museum]
    paths: ['museum/**', '.github/workflows/deploy-museum.yml']
  workflow_dispatch:

concurrency:
  group: deploy-museum
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: museum
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN fehlt. Repo -> Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Link Vercel project (creates it on first run)
        run: npx --yes vercel@latest link --yes --project our-museum --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        run: |
          URL=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" | tail -n 1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Museum deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
