<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Our Museum</title>
<meta name="description" content="A tiny museum, made just for you.">
<meta name="theme-color" content="#1a1d29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Our Museum">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<canvas id="gl" aria-label="Our Museum"></canvas>
<div id="vignette"></div>

<div id="ui">
  <div id="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="de">DE</button><button type="button" data-lang="es">ES</button></div>
  <!-- Zugangscode -->
  <section id="gate" class="screen" hidden>
    <div class="start-inner">
      <h1 class="title" data-title>Our Museum</h1>
      <p class="fromto"><span class="fr"><span data-t="from"></span> <em data-from></em><i></i></span><span data-t="to"></span> <em data-to></em></p>
      <form id="gate-form" class="panel" autocomplete="off">
        <label class="field">
          <span data-t="gateHint"></span>
          <input id="gate-input" type="password" inputmode="numeric" autocomplete="off" maxlength="16" spellcheck="false">
        </label>
        <p id="gate-msg" class="status" role="status"></p>
      </form>
    </div>
  </section>

  <!-- Start / lobby -->
  <section id="start" class="screen">
    <div class="start-inner">
      <h1 class="title" data-title>Our Museum</h1>
      <p class="fromto"><span class="fr"><span data-t="from"></span> <em data-from></em><i></i></span><span data-t="to"></span> <em data-to></em></p>

      <div class="panel" id="identity">
        <label class="field">
          <span data-t="yourName"></span>
          <input id="name" type="text" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false">
        </label>
        <p class="playas"><span data-t="playingAs"></span> <b id="char-name">Seb</b><button id="char-switch" type="button" class="link" data-t="switchChar"></button></p>
      </div>

      <div id="panel-main" class="panel sub">
        <div class="btn-row">
          <button id="btn-single" class="btn primary" data-t="single"></button>
          <button id="btn-multi" class="btn" data-t="multi"></button>
        </div>
      </div>

      <div id="panel-multi" class="panel" hidden>
        <button id="btn-create" class="btn primary wide" data-t="create"></button>
        <div class="or"><span data-t="or"></span></div>
        <div class="join-row">
          <input id="code" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" data-ph="codePlaceholder">
          <button id="btn-join" class="btn" data-t="join"></button>
        </div>
        <p id="multi-status" class="status" role="status"></p>
        <button id="btn-back" class="link" data-t="back"></button>
      </div>
      <p class="foot" data-t="startHint"></p>
      <button id="btn-install" class="link" type="button" hidden data-t="install"></button>
      <p id="ios-hint" class="foot" hidden data-t="iosHint"></p>
    </div>
  </section>

  <!-- Loading -->
  <section id="loading" class="screen" hidden>
    <div class="load-inner">
      <h1 class="title" data-title>Our Museum</h1>
      <p class="fromto"><span class="fr"><span data-t="from"></span> <em data-from></em><i></i></span><span data-t="to"></span> <em data-to></em></p>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <div class="bar-meta"><span data-t="preparing"></span><span id="bar-pct">0%</span></div>
    </div>
  </section>

  <!-- HUD -->
  <div id="hud" hidden>
    <div id="prompt" hidden><span class="pk" id="prompt-key">E</span><span id="prompt-label"></span></div>
    <div id="roompill" hidden>
      <span class="dot"></span><span id="room-text"></span>
      <button id="room-copy" type="button" data-t="copy"></button>
    </div>
    <div id="topright"><button id="btn-full" type="button" hidden aria-label="Fullscreen" data-icon="fullscreen"></button><button id="btn-leave" type="button" data-t="leave"></button></div>
    <div id="caption" hidden>
      <p class="ck" id="cap-kicker"></p>
      <p class="ct" id="cap-place"></p>
      <p class="cc" id="cap-coords"></p>
      <a id="cap-map" href="#" target="_blank" rel="noopener" data-t="openMap"></a>
    </div>
    <button id="btn-emote" type="button" aria-label="Emotes" data-icon="smile"></button>
    <div id="emotes" hidden>
      <button type="button" data-emote="wave"><b data-icon="wave"></b><span data-t="e_wave"></span></button>
      <button type="button" data-emote="dance"><b data-icon="dance"></b><span data-t="e_dance"></span></button>
      <button type="button" data-emote="clap"><b data-icon="clap"></b><span data-t="e_clap"></span></button>
      <button type="button" data-emote="heart"><b data-icon="heart"></b><span data-t="e_heart"></span></button>
      <button type="button" data-emote="bow"><b data-icon="bow"></b><span data-t="e_bow"></span></button>
      <button type="button" data-emote="cheer"><b data-icon="cheer"></b><span data-t="e_cheer"></span></button>
    </div>
    <div id="hints"></div>
    <div id="music" hidden></div>
    <div id="chatbox">
      <div id="chatlog" aria-live="polite"></div>
      <form id="chat" autocomplete="off" hidden>
        <input id="chat-input" type="text" maxlength="140" autocomplete="off" data-ph="chatPlaceholder">
      </form>
    </div>
    <div id="toast" hidden></div>
    <div id="touch" hidden>
      <div id="stick"><div id="knob"></div></div>
      <div id="tbtns">
        <button type="button" id="t-act" hidden></button>
        <button type="button" id="t-emote" aria-label="Emotes" data-icon="smile"></button>
        <button type="button" id="t-chat" aria-label="Chat" data-icon="chat"></button>
      </div>
    </div>
  </div>
</div>

<div id="reader" hidden>
  <article class="page" role="dialog" aria-modal="true">
    <button id="reader-close" type="button" aria-label="Close" data-icon="close"></button>
    <p class="kicker" id="reader-kicker"></p>
    <h2 id="reader-title"></h2>
    <div id="reader-body"></div>
  </article>
</div>
<div id="exit-screen" hidden>
  <p id="exit-text"></p>
  <button id="exit-back" type="button" class="link"></button>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
