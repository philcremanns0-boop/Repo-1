<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Our Museum</title>
<meta name="description" content="A tiny museum, made just for you.">
<meta name="theme-color" content="#1a1d29">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1d29'/%3E%3Cpath d='M6 24V12l10-6 10 6v12h-3V13.5L16 9 9 13.5V24z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
<canvas id="gl" aria-label="Our Museum"></canvas>

<div id="ui">
  <div id="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button></div>
  <!-- Start / lobby -->
  <section id="start" class="screen">
    <div class="start-inner">
      <h1 class="title" data-title>Our Museum</h1>
      <p class="fromto"><span data-t="from"></span> <em data-from></em><i></i><span data-t="to"></span> <em data-to></em></p>

      <div class="panel" id="identity">
        <label class="field">
          <span data-t="yourName"></span>
          <input id="name" type="text" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false">
        </label>
        <p class="playas"><span data-t="playingAs"></span> <b id="char-name">Seb</b><button id="char-switch" type="button" class="link" data-t="switchChar"></button></p>
      </div>

      <div id="panel-main" class="panel sub">
        <div class="btn-row">
          <button id="btn-single" class="btn primary" data-t="single"></button>
          <button id="btn-multi" class="btn" data-t="multi"></button>
        </div>
      </div>

      <div id="panel-multi" class="panel" hidden>
        <button id="btn-create" class="btn primary wide" data-t="create"></button>
        <div class="or"><span data-t="or"></span></div>
        <div class="join-row">
          <input id="code" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" data-ph="codePlaceholder">
          <button id="btn-join" class="btn" data-t="join"></button>
        </div>
        <p id="multi-status" class="status" role="status"></p>
        <button id="btn-back" class="link" data-t="back"></button>
      </div>
      <p class="foot" data-t="startHint"></p>
    </div>
  </section>

  <!-- Loading -->
  <section id="loading" class="screen" hidden>
    <div class="load-inner">
      <h1 class="title" data-title>Our Museum</h1>
      <p class="fromto"><span data-t="from"></span> <em data-from></em><i></i><span data-t="to"></span> <em data-to></em></p>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <div class="bar-meta"><span data-t="preparing"></span><span id="bar-pct">0%</span></div>
    </div>
  </section>

  <!-- HUD -->
  <div id="hud" hidden>
    <div id="prompt" hidden><span class="pk" id="prompt-key">E</span><span id="prompt-label"></span></div>
    <div id="roompill" hidden>
      <span class="dot"></span><span id="room-text"></span>
      <button id="room-copy" type="button" data-t="copy"></button>
    </div>
    <button id="btn-leave" type="button" data-t="leave"></button>
    <div id="hints"></div>
    <div id="music" hidden></div>
    <form id="chat" autocomplete="off" hidden>
      <input id="chat-input" type="text" maxlength="140" autocomplete="off" data-ph="chatPlaceholder">
    </form>
    <div id="toast" hidden></div>
    <div id="touch" hidden>
      <div id="stick"><div id="knob"></div></div>
      <div id="tbtns">
        <button type="button" id="t-act" hidden></button>
        <button type="button" id="t-dance">♪</button>
        <button type="button" id="t-chat">💬</button>
      </div>
    </div>
  </div>
</div>

<div id="reader" hidden>
  <article class="page" role="dialog" aria-modal="true">
    <button id="reader-close" type="button" aria-label="Close">×</button>
    <p class="kicker" id="reader-kicker"></p>
    <h2 id="reader-title"></h2>
    <div id="reader-body"></div>
  </article>
</div>
<div id="exit-screen" hidden>
  <p id="exit-text"></p>
  <button id="exit-back" type="button" class="link"></button>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
